<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importação do framework Bootstrap 5 para estilização e componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Importação do CSS personalizado da página de login -->
    <link rel="stylesheet" href="assests/css/login.css">
    <link rel="stylesheet" href="assests/css/estabelecimentos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Bouillon</title>
</head>

<!-- Codigo da tela de login - centralizada vertical e horizontalmente na tela -->
<body class="d-flex align-items-center py-4 bg-body-tertiary h-100">

    <!-- Contêiner principal do formulário de login -->
    <main class="w-100 m-auto form-container">
        <form data-auth="login" method="post">

            <!-- Logo e nome do site no topo do formulário -->
            <h1> <img id="foto" src="assests/imagens/bouillon.png">Bouillon</h1>

            <div class="form-floating mb-3">
                <select class="form-select" id="tipoConta" name="tipoConta" required>
                    <option value="Cliente">Cliente (CPF)</option>
                    <option value="Proprietario">Estabelecimento (CNPJ)</option>
                </select>
                <label for="tipoConta">Tipo de conta</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="documento" name="documento" placeholder="CPF" inputmode="numeric" maxlength="18" required>
                <label for="documento">CPF do cliente</label>
            </div>

            <!-- Campo de entrada do e-mail com label flutuante -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com" autocomplete="username" maxlength="100" required>
                <label for="floatingInput">Digite seu email</label>
            </div>

            <!-- Campo de entrada da senha com label flutuante -->
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" name="senha" placeholder="Password" autocomplete="current-password" minlength="6" maxlength="128" required>
                <label for="floatingPassword">Senha</label>
            </div>

            <a href="conta.html"> Crie sua conta</a>
            <p></p>

            <!-- Botão para realizar o login -->
            <button type="submit" class="btn btn-primary ">Logar</button>

        </form>
        <p class="text-danger mt-3 mb-0" data-auth-error role="alert" hidden></p>
        <section data-auth-session hidden>
            <header class="account-header">
                <div class="account-brand"><img src="assests/imagens/bouillon.png" width="44" height="44" alt=""><span>Bouillon</span></div>
                <p data-auth-user></p>
            </header>
            <section class="establishments" data-establishments aria-labelledby="establishments-title" tabindex="0" hidden>
                <h1 class="establishments-title" id="establishments-title">Meus estabelecimentos</h1>
                <details class="establishment-editor" data-create-establishment>
                    <summary class="btn establishment-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i> Criar estabelecimento</summary>
                    <form class="establishment-form" method="post">
                        <div class="establishment-fields">
                            <fieldset>
                                <legend><i class="bi bi-shop" aria-hidden="true"></i> Dados do estabelecimento</legend>
                                <div class="establishment-field-grid">
                                    <div class="field-wide">
                                        <label class="form-label" for="estabelecimento-nome">Nome do estabelecimento</label>
                                        <input class="form-control" id="estabelecimento-nome" name="nome" required minlength="3" maxlength="100">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-cnpj">CNPJ do estabelecimento</label>
                                        <input class="form-control" id="estabelecimento-cnpj" name="cnpj" required inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-categoria">Categoria</label>
                                        <select class="form-select" id="estabelecimento-categoria" name="categoriaId" required>
                                            <option value="">Selecione uma categoria</option>
                                        </select>
                                    </div>
                                    <div class="field-wide">
                                        <label class="form-label" for="estabelecimento-descricao">Descrição <span>(opcional)</span></label>
                                        <textarea class="form-control" id="estabelecimento-descricao" name="descricao" maxlength="1000" rows="2"></textarea>
                                    </div>
                                </div>
                            </fieldset>
                            <fieldset class="establishment-cover">
                                <legend><i class="bi bi-camera" aria-hidden="true"></i> Foto de capa <span>(opcional)</span></legend>
                                <div class="photo-picker" data-photo-picker>
                                    <img class="photo-preview" data-photo-preview alt="Prévia da foto de capa" hidden>
                                    <label class="photo-select" for="estabelecimento-foto">
                                        <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
                                        <span data-photo-action>Escolher foto de capa</span>
                                    </label>
                                    <input class="visually-hidden" id="estabelecimento-foto" name="arquivo" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="capa-formatos">
                                    <p class="photo-filename" data-photo-name hidden></p>
                                    <p class="photo-format" id="capa-formatos">JPG, PNG ou WebP, até 5 MB.</p>
                                    <button class="btn btn-link btn-sm" type="button" data-remove-photo hidden>Remover foto</button>
                                </div>
                            </fieldset>
                            <fieldset class="establishment-address">
                                <legend><i class="bi bi-geo-alt" aria-hidden="true"></i> Endereço e contato</legend>
                                <div class="establishment-field-grid">
                                    <div class="field-wide">
                                        <label class="form-label" for="estabelecimento-rua">Rua</label>
                                        <input class="form-control" id="estabelecimento-rua" name="rua" required maxlength="100" autocomplete="address-line1">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-numero">Número</label>
                                        <input class="form-control" id="estabelecimento-numero" name="numero" maxlength="100">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-bairro">Bairro</label>
                                        <input class="form-control" id="estabelecimento-bairro" name="bairro" maxlength="50">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-cidade">Cidade</label>
                                        <input class="form-control" id="estabelecimento-cidade" name="cidade" required maxlength="50" autocomplete="address-level2">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-estado">UF</label>
                                        <input class="form-control" id="estabelecimento-estado" name="estado" maxlength="2" autocomplete="address-level1">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-cep">CEP</label>
                                        <input class="form-control" id="estabelecimento-cep" name="cep" inputmode="numeric" maxlength="9" autocomplete="postal-code">
                                    </div>
                                    <div>
                                        <label class="form-label" for="estabelecimento-telefone">Telefone</label>
                                        <input class="form-control" id="estabelecimento-telefone" name="telefone" type="tel" maxlength="20" autocomplete="tel">
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                        <div class="establishment-form-actions">
                            <p class="text-danger mb-2" role="alert" data-create-error hidden></p>
                            <button class="btn establishment-primary" type="submit">Salvar estabelecimento</button>
                        </div>
                    </form>
                </details>
                <p class="alert alert-success" data-establishment-feedback role="status" hidden></p>
                <ul class="establishment-list" data-establishment-list hidden></ul>
                <p class="establishment-status" data-establishment-status role="status"></p>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-establishment-more hidden>Ver mais</button>
            </section>
            <div class="account-actions">
                <a class="btn btn-outline-secondary" href="site.html">Voltar ao início</a>
                <button type="button" class="btn btn-outline-secondary" data-auth-logout>Sair</button>
            </div>
        </section>
    </main>
    <template id="estabelecimento-enviar-foto">
        <details class="establishment-upload">
            <summary class="btn establishment-secondary"><i class="bi bi-camera" aria-hidden="true"></i> Adicionar foto</summary>
            <form class="mt-2" method="post">
                <div class="photo-picker photo-picker-compact" data-photo-picker>
                    <img class="photo-preview" data-photo-preview alt="Prévia da nova foto" hidden>
                    <label class="photo-select">
                        <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
                        <span data-photo-action>Escolher foto</span>
                        <input class="visually-hidden" name="arquivo" type="file" accept="image/jpeg,image/png,image/webp" required>
                    </label>
                    <p class="photo-filename" data-photo-name hidden></p>
                    <p class="photo-format">JPG, PNG ou WebP, até 5 MB.</p>
                    <button class="btn btn-link btn-sm" type="button" data-remove-photo hidden>Remover foto</button>
                </div>
                <label class="form-label d-block">
                    Legenda (opcional)
                    <input class="form-control" name="legenda" maxlength="150">
                </label>
                <button class="btn btn-sm btn-primary" type="submit">Enviar foto</button>
                <p class="text-danger mt-2 mb-0" role="alert" hidden></p>
            </form>
        </details>
    </template>

    <!-- Importação do JavaScript do Bootstrap (necessário para componentes interativos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assests/js/auth.js" defer></script>
</body>
</html>
