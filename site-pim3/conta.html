<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importação do framework Bootstrap 5 para estilização e componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Importação do CSS personalizado da página de criação de conta -->
    <link rel="stylesheet" href="assests/css/conta.css">
    <title>Conta</title>
</head>

<!-- Codigo da tela para criar a conta - centralizada vertical e horizontalmente na tela -->
<body class="d-flex align-items-center py-4 bg-body-tertiary h-100">

  <!-- Contêiner principal do formulário de cadastro -->
  <main class="w-100 m-auto form-container">
    <form data-auth="registar" method="post">

      <!-- Logo e nome do site no topo do formulário -->
      <h1>
        <img src="assests/imagens/bouillon.png" class="mb-3" height="100" width="120">
        Bouillon
      </h1>

      <div class="form-floating mb-3">
        <select class="form-select" id="tipoConta" name="tipoConta" required>
          <option value="Cliente">Cliente (CPF)</option>
          <option value="Proprietario">Estabelecimento (CNPJ)</option>
        </select>
        <label for="tipoConta">Tipo de conta</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="documento" name="documento" placeholder="CPF" inputmode="numeric" maxlength="18" required>
        <label for="documento">CPF do cliente</label>
      </div>

      <!-- Campo de nome de usuário com label flutuante -->
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingUsername" name="nome" placeholder="nome_usuario" autocomplete="name" minlength="2" maxlength="60" required>
        <label for="floatingUsername">Nome de usuário</label>
      </div>

      <!-- Campo de e-mail com label flutuante -->
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingEmail" name="email" placeholder="nome@exemplo.com" autocomplete="username" maxlength="100" required>
        <label for="floatingEmail">Email</label>
      </div>

      <!-- Campo de senha com label flutuante -->
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingPassword" name="senha" placeholder="Senha" autocomplete="new-password" minlength="6" maxlength="128" required>
        <label for="floatingPassword">Senha</label>
      </div>

      <!-- Campo de confirmação de senha com label flutuante -->
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingConfirmPassword" name="confirmarSenha" placeholder="Confirme a senha" autocomplete="new-password" required>
        <label for="floatingConfirmPassword">Digite a senha novamente</label>
      </div> 

      <!-- Botão para enviar o formulário e criar a conta -->
      <button type="submit" class="btn btn-primary">Cadastre-se</button>
      <a class="ms-2" href="login.html">Já tenho conta</a>

    </form>
    <p class="text-danger mt-3 mb-0" data-auth-error role="alert" hidden></p>
  </main>

<!-- Importação do JavaScript do Bootstrap (necessário para componentes interativos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="assests/js/auth.js" defer></script>
</body>
</html>
